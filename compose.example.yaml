name: vps-bill

services:
  bot:
    image: vps-bill:${APP_VERSION:-2.5.13}
    container_name: vps-bill
    restart: unless-stopped
    env_file:
      - /opt/vps-bill/.env
    volumes:
      - /opt/vps-bill/data:/app/data
      - /opt/vps-bill/backups:/app/backups
      - /opt/vps-bill/update-requests:/app/update-requests
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    stop_grace_period: 25s
    healthcheck:
      test: ["CMD", "python", "-m", "app.cli", "health", "--runtime"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
